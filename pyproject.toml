[project]
name = "orientia-rag"
version = "0.1.0"
description = "ORIENT'IA — assistant intelligent d'orientation pédagogique (ISPM) : RAG, ML et agent conversationnel"
readme = "README.md"
authors = [
    { name = "visualpivert", email = "visualpivert@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "langchain>=1.3.17",
    "langchain-openrouter>=0.2.8",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.2",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
orientia-rag = "orientia_rag:main"
orientia-app = "orientia_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
